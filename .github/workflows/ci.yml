name: CI - Tests and Docker Build

# Define cuándo se ejecuta el pipeline
on:
  push:
    branches:
      - actividad-pipeline-ci
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:
  
jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias definidas en requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Compilar código Python
        run: |
          python -m compileall .

      - name: Control de calidad de código
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Ejecutar tests
        run: |
          python -m pytest

      - name: Construir imagen Docker usando el Dockerfile del proyecto
        run: | 
          docker build -t actividad-pipeline-api .
